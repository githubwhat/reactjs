name: economy/us — daily data update & deploy

# 프로젝트 위치: economy/us (USAPI — US Economic Indicators)
on:
  schedule:
    - cron: '17 18 * * *' # 매일 KST 03:17 (UTC 18:17)
    - cron: '17 21 * * *' # KST 06:17 재시도 — 오늘 이미 성공했으면 건너뜀 (예약 지연·누락 대비)
  workflow_dispatch:
    inputs:
      full:
        description: '전체 이력 재수집 (평소에는 끄기)'
        type: boolean
        default: false
      deploy:
        description: 'FTP 배포 실행'
        type: boolean
        default: true

permissions:
  contents: write # 수집한 JSON을 저장소에 커밋해 이력을 누적

concurrency:
  group: economy-us-daily
  cancel-in-progress: false

defaults:
  run:
    working-directory: economy/us

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: 재시도 실행 필요 여부
        id: gate
        if: github.event_name == 'schedule' && github.event.schedule == '17 21 * * *'
        run: node scripts/check-today.js

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: economy/us/package-lock.json

      - name: npm ci
        if: steps.gate.outputs.skip != 'true'
        run: npm ci

      - name: 원천 점검 (무등록 접속·파싱)
        if: steps.gate.outputs.skip != 'true'
        run: npm run verify:sources

      - name: 데이터 수집·JSON 생성
        id: update
        if: steps.gate.outputs.skip != 'true'
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then npm run update:full; else npm run update:data; fi

      - name: 위험 깃발 단위테스트
        if: steps.gate.outputs.skip != 'true'
        run: npm test

      - name: 빌드
        if: steps.gate.outputs.skip != 'true'
        run: npm run build

      - name: FTP 배포 (InfinityFree)
        id: deploy
        if: steps.gate.outputs.skip != 'true' && env.FTP_HOST != '' && (github.event_name == 'schedule' || inputs.deploy)
        run: npm run deploy:ftp

      - name: FTP 정보 없음 안내
        if: steps.gate.outputs.skip != 'true' && env.FTP_HOST == ''
        run: echo "::warning::FTP_HOST 등 Secrets가 없어 배포를 건너뛰었습니다. 수집·빌드는 완료되었습니다."

      # 배포가 실패해도 수집한 데이터는 저장소에 남겨 다음 실행에서 재사용
      - name: 수집 데이터 커밋
        if: always() && steps.update.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data reports
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "economy/us data: 자동 갱신 $(TZ=Asia/Seoul date +%F)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done

      - name: 실행 요약
        if: always() && steps.gate.outputs.skip != 'true'
        run: |
          {
            echo "### economy/us 갱신 결과"
            node -e "const l=require('./reports/update-log.json')[0]||{};console.log('- 공개 지표:',l.implemented,'개');console.log('- 깃발:',JSON.stringify(l.tally));for(const [k,v] of Object.entries(l.sources||{}))console.log('- '+k+': '+v.ok+' 성공 / '+v.failed+' 실패'+(v.errors&&v.errors.length?' — '+v.errors.join('; '):''))"
            node -e "try{const d=require('./reports/deploy-log.json')[0];console.log('- 배포:',d.ok?('성공 '+d.uploaded+'개 파일'):('실패 '+d.error),d.siteCheck||'')}catch{console.log('- 배포: 기록 없음')}"
          } >> "$GITHUB_STEP_SUMMARY"
